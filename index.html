<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Superhero Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">Which Superhero Are You?</h1>
    
    <div class="container d-flex justify-content-center">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">1. How do you prefer to fight crime?</h4>
        <div class="row g-2">
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="1">With Super Strength</button></div>
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="2">With Gadgets & Intelligence</button></div>
        </div>
      </div>
    </div>

    <div class="container d-flex justify-content-center">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">2. Choose your favorite colors:</h4>
        <div class="row g-2">
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="1">Red and Blue</button></div>
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="2">Black and Yellow</button></div>
        </div>
      </div>
    </div>

    <div class="container d-flex justify-content-center">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">3. Where would your secret base be?</h4>
        <div class="row g-2">
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="1">An Arctic Fortress</button></div>
          <div class="col-6"><button class="btn btn-outline-primary w-100 answer-btn" data-points="2">An Underground Cave</button></div>
        </div>
      </div>
    </div>

    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show My Hero!</button>
    </div>    

    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4 text-center" style="width: 75%; display: none;">
        <h3>Your Hero:</h3>
        <p id="result-text" class="fw-bold fs-4"></p>
      </div>
    </div>
    
     <script src="./js/script.js"></script>
</body>
</html>
